name: Collect KBO

on:
  workflow_dispatch:
  schedule:
    - cron: "20 15 * * *"

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch KBO tables
        run: python3 scripts/fetch_kbo.py
      - name: Commit if changed
        run: |
          git config user.name "kbo-collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "KBO 일자별 기록 수집"
          git push
