<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>KBO 순위 시뮬레이터</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <h1>KBO 순위 시뮬</h1>
        <small id="data-status">불러오는 중…</small>
      </div>
      <nav class="tabs">
        <button type="button" data-tab="sim" class="active">시뮬레이터</button>
        <button type="button" data-tab="records">기록실</button>
      </nav>
    </header>

    <main>
      <section id="panel-sim" class="panel active">
        <div class="toolbar">
          <p class="hint">잔여 경기를 승/패/무로 배정하면 최종 순위가 다시 계산됩니다. 5위 아래 금선은 가을야구 컷.</p>
          <div class="actions">
            <button id="reset-sim" class="btn" type="button">초기화</button>
            <button id="reload-data" class="btn" type="button">새로고침</button>
          </div>
        </div>
        <div id="sim-table"></div>
      </section>

      <section id="panel-records" class="panel">
        <div class="toolbar">
          <p id="asof" class="meta"></p>
        </div>

        <article class="section">
          <h2>팀 순위</h2>
          <a class="src" href="https://www.koreabaseball.com/Record/TeamRank/TeamRankDaily.aspx" target="_blank" rel="noreferrer">koreabaseball.com/Record/TeamRank/TeamRankDaily.aspx</a>
          <div id="rank-table"></div>
        </article>

        <article class="section">
          <h2>팀 타격 순위</h2>
          <a class="src" href="https://www.koreabaseball.com/Record/Team/Hitter/Basic1.aspx" target="_blank" rel="noreferrer">koreabaseball.com/Record/Team/Hitter/Basic1.aspx</a>
          <div id="hitter-table"></div>
        </article>

        <article class="section">
          <h2>팀 투수 순위</h2>
          <a class="src" href="https://www.koreabaseball.com/Record/Team/Pitcher/Basic1.aspx" target="_blank" rel="noreferrer">koreabaseball.com/Record/Team/Pitcher/Basic1.aspx</a>
          <div id="pitcher-table"></div>
        </article>
      </section>
    </main>

    <script src="js/app.js"></script>
  </body>
</html>
